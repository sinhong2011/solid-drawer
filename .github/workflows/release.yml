name: Release

# Automated releases with release-please, and publishing to npm.
#
# 1. Every push to main runs release-please. It reads the conventional
#    commits since the last release (feat:, fix:, feat!: ...) and keeps a
#    "chore(main): release X.Y.Z" pull request open and up to date, with the
#    version bump in package.json and the entry in CHANGELOG.md.
# 2. Merging that PR makes release-please create the vX.Y.Z tag and GitHub
#    release, and the publish job below publishes that commit to npm.
# 3. Pushing a vX.Y.Z tag by hand also publishes (the one-time bootstrap of a
#    version that predates this workflow). The tag must match package.json.
#
# Setup, once, in the repository settings:
# - Settings > Actions > General: "Allow GitHub Actions to create and approve
#   pull requests", so release-please can open the release PR.
# - Secret NPM_TOKEN: an npm granular access token with publish rights and
#   2FA bypass. Or configure npm trusted publishing for this repository and
#   workflow (release.yml), and drop the NODE_AUTH_TOKEN line below.
# - Optional secret RELEASE_PLEASE_TOKEN: a PAT with contents + pull-requests
#   write. Pull requests opened with the default GITHUB_TOKEN don't trigger
#   the CI workflow; with a PAT the release PR gets CI checks like any other.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Check the version
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "$name@$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if [[ -n "$(npm view "$name@$version" version 2>/dev/null)" ]]; then
            echo "::notice::$name@$version is already on npm, nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs check, typecheck, test and build.
      - name: Publish to npm
        if: steps.version.outputs.skip != 'true'
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
